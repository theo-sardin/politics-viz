[project]
name = "politics-viz"
version = "0.2.0"
description = "Radar des intérêts financiers déclarés des responsables publics français (HATVP × votes × lobbying)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "lxml>=5.3",
    "jinja2>=3.1",
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
pv = "pv.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pv*"]

[tool.setuptools.package-data]
"pv.web" = ["templates/*.html", "static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = [
    "E501",  # the formatter wraps what can be wrapped; long strings and SQL stay readable
    "B008",  # FastAPI's Depends() in argument defaults is the framework's idiom
]
