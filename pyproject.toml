[project]
name = "politics-viz"
version = "0.1.0"
description = "Visualization of French politicians' declared financial interests (HATVP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "lxml>=5.3",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "db", "sync"]

[tool.setuptools.packages.find]
include = ["parsers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
