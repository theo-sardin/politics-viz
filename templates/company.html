{% extends "base.html" %}
{% block title %}{{ company.name }} — politics-viz{% endblock %}
{% block main %}
<p><a href="/">← Dashboard</a></p>
<h1>{{ company.name }}</h1>
<p class="lede">
    Total declared: <strong id="company-total">…</strong> ·
    <span id="company-people">…</span> declarants
</p>

<div class="grid">
    <section class="card">
        <h2>Declared € by party</h2>
        <div class="chart-box"><canvas id="chart-party"></canvas></div>
    </section>
    <section class="card">
        <h2>Quarterly timeline</h2>
        <div class="chart-box"><canvas id="chart-timeline"></canvas></div>
    </section>
    <section class="card" style="grid-column: 1 / -1">
        <h2>Holders</h2>
        <table id="table-holders">
            <thead><tr><th>Name</th><th>Party</th><th class="num">Declared €</th></tr></thead>
            <tbody></tbody>
        </table>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script>
(async function () {
    const esc = pv.escapeHtml;
    const data = await pv.fetchJSON('/api/company/{{ company.slug }}');

    document.getElementById('company-total').textContent = pv.formatEur(data.company.total);
    document.getElementById('company-people').textContent = data.holders.length;

    // Party breakdown bar
    const bp = data.by_party;
    new Chart(document.getElementById('chart-party').getContext('2d'), {
        type: 'bar',
        data: {
            labels: bp.map(r => r.label),
            datasets: [{
                data: bp.map(r => r.total),
                backgroundColor: bp.map(r => r.color),
                borderRadius: 3,
            }],
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            onClick: (evt, items) => {
                if (!items.length) return;
                window.location = '/party/' + bp[items[0].index].slug;
            },
            scales: {
                y: { ticks: { callback: v => pv.formatEur(v) }, grid: { color: pv.gridColor() } },
                x: { grid: { display: false } },
            },
        },
    });

    // Timeline line
    const tl = data.timeline;
    new Chart(document.getElementById('chart-timeline').getContext('2d'), {
        type: 'line',
        data: {
            labels: tl.map(p => p.period),
            datasets: [{
                data: tl.map(p => p.total),
                borderColor: '#0d378a', backgroundColor: '#0d378a22',
                tension: 0.3, fill: true, pointRadius: 3,
            }],
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { ticks: { callback: v => pv.formatEur(v) }, grid: { color: pv.gridColor() } },
                x: { grid: { display: false }, ticks: { maxRotation: 45, font: { size: 10 } } },
            },
        },
    });

    // Holders table
    if (pv.fillTable('table-holders', data.holders, 3)) {
        document.querySelector('#table-holders tbody').innerHTML = data.holders.map(h => `
            <tr>
                <td><a href="/declarant/${h.id}">${esc(h.prenom)} ${esc(h.nom)}</a></td>
                <td><span class="party-pill" style="background:${h.party_color}">${esc(h.party_label)}</span></td>
                <td class="num">${pv.formatEur(h.total)}</td>
            </tr>`).join('');
    }
})();
</script>
{% endblock %}
