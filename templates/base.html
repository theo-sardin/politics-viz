<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}politics-viz{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v={{ asset_version }}">
</head>
<body>
<header>
    <a class="brand" href="/">politics-viz</a>
    <nav>
        <a href="/">Tableau de bord</a>
    </nav>
    <div class="search-wrap">
        <input type="search" id="search-input" placeholder="Rechercher un député…" autocomplete="off">
        <div id="search-results" class="search-results"></div>
    </div>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer>
    <p>Source : HATVP · NosDéputés · data.senat.fr · Parlement européen.</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-parliament-chart@0.0.6/build/d3-parliament-chart.min.js"></script>
<script src="{{ url_for('static', path='app.js') }}?v={{ asset_version }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
