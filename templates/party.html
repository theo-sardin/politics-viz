{% extends "base.html" %}
{% block title %}{{ party.label }} — politics-viz{% endblock %}
{% block main %}
<p><a href="/">← Dashboard</a></p>
<h1>
    <span class="party-pill" style="background: {{ party.color }}">{{ party.label }}</span>
</h1>

<div class="window-selector">
    <a href="/party/{{ party.slug }}?window=12m" class="{% if window == '12m' %}active{% endif %}">12 months</a>
    <a href="/party/{{ party.slug }}?window=24m" class="{% if window == '24m' %}active{% endif %}">24 months</a>
    <a href="/party/{{ party.slug }}?window=all" class="{% if window == 'all' %}active{% endif %}">All time</a>
</div>

<div class="grid">
    <section class="card">
        <h2>Top 20 companies held by members</h2>
        <canvas id="chart-top"></canvas>
    </section>
    <section class="card">
        <h2>New &amp; growth surges (window)</h2>
        <table id="table-surges">
            <thead><tr><th>Company</th><th>Type</th><th class="num">Δ €</th></tr></thead>
            <tbody></tbody>
        </table>
    </section>
    <section class="card" style="grid-column: 1 / -1">
        <h2>Members (<span id="count-members"></span>)</h2>
        <table id="table-members">
            <thead><tr><th>Name</th><th class="num">Total declared €</th></tr></thead>
            <tbody></tbody>
        </table>
    </section>
</div>

<script>
(async function () {
    const data = await pv.fetchJSON('/api/party/{{ party.slug }}?window={{ window }}');

    const top = data.top_companies;
    pv.barChart(document.getElementById('chart-top'), {
        labels: top.map(c => c.name || c.slug),
        data: top.map(c => c.total),
        color: {{ party.color | tojson }},
        onBarClick: (i) => { window.location = '/company/' + top[i].slug; },
    });

    const surges = data.surges;
    document.querySelector('#table-surges tbody').innerHTML = surges.map(r => `
        <tr>
            <td><a href="/company/${r.slug}">${escapeHtml(r.name || r.slug)}</a></td>
            <td>${r.change_type}</td>
            <td class="num">${pv.formatEur(r.delta)}</td>
        </tr>`).join('');

    const members = data.members;
    document.getElementById('count-members').textContent = members.length;
    document.querySelector('#table-members tbody').innerHTML = members.map(m => `
        <tr>
            <td><a href="/declarant/${m.id}">${escapeHtml(m.prenom)} ${escapeHtml(m.nom)}</a></td>
            <td class="num">${pv.formatEur(m.total)}</td>
        </tr>`).join('');

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
})();
</script>
{% endblock %}
